tree:
  - id: N01
    type: question
    title: "Audit the repository's agentic workflow"
    provenance: user
    timestamp: "2026-07-28T20:21+02:00"
    description: >
      Determine whether the repository contains problems in its two-agent
      operating workflow.
    status: resolved
    children:
      - id: N02
        type: experiment
        title: "Probe the documented installation command"
        provenance: ai-executed
        timestamp: "2026-07-28T20:21+02:00"
        result: >
          In a disposable target repository, the documented copy command
          changed origin from the target URL to the kit URL and changed the
          active branch and HEAD to the kit's values.
        evidence:
          - "docs/audits/agent-workflow-audit.md"
        status: resolved
        children: []
      - id: N03
        type: experiment
        title: "Exercise validator edge-state fixtures"
        provenance: ai-executed
        timestamp: "2026-07-28T20:21+02:00"
        result: >
          Eleven of eleven fixtures disagreed with protocol expectations: one
          documented valid review form was rejected and ten invalid states were
          accepted.
        evidence:
          - "docs/audits/agent-workflow-audit.md"
        status: resolved
        children: []
      - id: N04
        type: experiment
        title: "Independently falsify audit findings"
        provenance: ai-executed
        timestamp: "2026-07-28T20:21+02:00"
        result: >
          A second agent reproduced F1, F2, all eleven validator mismatches,
          and the rejected-branch closeout failure; it returned Accepted with
          follow-up.
        evidence:
          - "docs/tasks/001-agent-workflow-audit.md"
        status: resolved
        children: []
      - id: N05
        type: decision
        title: "Accept and archive the workflow audit"
        provenance: ai-executed
        timestamp: "2026-07-28T20:21+02:00"
        choice: >
          Merge and archive the reviewed audit while leaving workflow fixes for
          follow-up work.
        alternatives:
          - "Require revision of the audit"
          - "Reject the audit"
          - "Implement fixes in the review task"
        evidence:
          - "N02"
          - "N03"
          - "N04"
          - "docs/audits/agent-workflow-audit.md"
        status: resolved
        children:
          - id: N06
            type: decision
            title: "Remediate every accepted audit finding"
            provenance: user
            timestamp: "2026-07-29T00:07+02:00"
            choice: >
              Fix all six independently supported workflow findings rather
              than leave them as follow-up work.
            alternatives:
              - "Leave the accepted findings unresolved"
              - "Remediate only a subset"
            evidence:
              - "docs/audits/agent-workflow-audit.md"
              - "docs/tasks/001-agent-workflow-audit.md"
            status: resolved
            children:
              - id: N07
                type: experiment
                title: "Adversarially validate the workflow remediation"
                provenance: ai-executed
                timestamp: "2026-07-29T00:07+02:00"
                result: >
                  Two independent review revision rounds added ten regression
                  cases beyond the initial suite. The final 31 tests passed,
                  the repository validator accepted both archives, and the
                  reviewer returned Accepted.
                evidence:
                  - "docs/tasks/002-fix-workflow-audit-findings.md"
                  - "tests/test_agent_workflow.py"
                  - "scripts/validate_agent_workflow.py"
                  - "c879ad7"
                status: resolved
                children:
                  - id: N08
                    type: decision
                    title: "Merge and archive the accepted remediation"
                    provenance: ai-executed
                    timestamp: "2026-07-29T00:07+02:00"
                    choice: >
                      Merge task 002 into main, archive its complete handoff
                      history, and reset current-task.md to the exact template.
                    alternatives:
                      - "Require another revision without new contrary evidence"
                      - "Leave the accepted task unmerged"
                evidence:
                  - "N07"
                  - "docs/tasks/002-fix-workflow-audit-findings.md"
                  - "b444f6c"
                  - "f198163"
                status: resolved
                children: []
  - id: N09
    type: question
    title: "Assess cross-repository workflow adoption"
    provenance: user
    timestamp: "2026-07-29T00:55+02:00"
    description: >
      Determine whether Prospect, StructSplat, realtime-gs, and
      IntrinsicEngine should add or replace their workflows with agent-kit,
      and identify workflow mechanisms worth bringing back into agent-kit.
    status: resolved
    children:
      - id: N10
        type: experiment
        title: "Probe target compatibility and workflow evidence"
        provenance: ai-executed
        timestamp: "2026-07-29T00:55+02:00"
        result: >
          Read-only inventory and executable checks found 11, 12, 11, and 12
          tracked-path collisions respectively; the payload also contains
          non-colliding agent-kit state and research history. Target structural
          checks passed and each target recorded real review practice without
          general identity/verdict enforcement.
        evidence:
          - "docs/research/cross-repository-agent-workflow-adoption.md"
          - "docs/tasks/003-cross-repository-agent-workflow-adoption.md"
          - "d8d649512f454c219dba55dd12f4d0398cb742e9"
        status: resolved
        children: []
      - id: N11
        type: experiment
        title: "Falsify the first adoption assessment"
        provenance: ai-executed
        timestamp: "2026-07-29T00:55+02:00"
        result: >
          Independent review reproduced the collision and history findings but
          rejected unsupported adoption rankings, an overbroad P0, and
          conflation of review norms, recorded practice, and enforcement.
        evidence:
          - "docs/tasks/003-cross-repository-agent-workflow-adoption.md"
          - "37c3a1f"
        status: resolved
        children: []
      - id: N12
        type: experiment
        title: "Validate the calibrated assessment"
        provenance: ai-executed
        timestamp: "2026-07-29T00:55+02:00"
        result: >
          After six bounded revisions, independent review reproduced the exact
          collision counts and history payload, accepted the review taxonomy
          and P0/P1/P2 split, and returned Accepted. All 31 workflow tests and
          live validation passed.
        evidence:
          - "docs/research/cross-repository-agent-workflow-adoption.md"
          - "docs/tasks/003-cross-repository-agent-workflow-adoption.md"
          - "849b02e"
        status: resolved
        children: []
      - id: N13
        type: decision
        title: "Leave target workflows unchanged pending bounded pilots"
        provenance: ai-executed
        timestamp: "2026-07-29T00:55+02:00"
        choice: >
          Do not install agent-kit into or replace any assessed target
          workflow. First create a clean distribution boundary in agent-kit;
          then measure minimal coordination pilots in realtime-gs and
          Prospect, with only failure-triggered in-place experiments for
          StructSplat and IntrinsicEngine.
        alternatives:
          - "Install the full workflow in one or more targets now"
          - "Replace the targets' existing workflows"
          - "Add a parallel agent-kit task authority"
          - "Make no reciprocal improvements to agent-kit"
        evidence:
          - "N10"
          - "N11"
          - "N12"
          - "docs/research/cross-repository-agent-workflow-adoption.md"
        status: resolved
        children:
          - id: N14
            type: decision
            title: "Implement the clean distribution boundary and results audit"
            provenance: user
            timestamp: "2026-07-29T08:59+02:00"
            choice: >
              Fix the accepted clean-distribution blocker and add the bounded
              generic results-audit procedure in Task 004, without installing
              into targets or adding P2 or configurable-platform scope.
            alternatives:
              - "Leave the accepted P0 and P1 findings unresolved"
              - "Expand Task 004 into target integration or distribution infrastructure"
            evidence:
              - "N10"
              - "N12"
              - "N13"
              - "docs/research/cross-repository-agent-workflow-adoption.md"
            status: resolved
            children:
              - id: N15
                type: experiment
                title: "Exercise the fixed distribution implementation"
                provenance: ai-executed
                timestamp: "2026-07-29T08:59+02:00"
                result: >
                  Commit 92148b4 introduced the fixed 22-file payload and
                  results-audit skill. Six disposable distribution tests and
                  all 36 repository tests passed; the installed blank target
                  validated with 11 skills and zero archives, collision
                  targets remained unchanged, and Driver code audit found no
                  required fix before independent review.
                evidence:
                  - "92148b4c19b84614301c03ff77b736de54cb65d7"
                  - "tests/test_distribution.py"
                  - "docs/audits/distribution-installer.md"
                  - ".agents/state/current-task.md"
                  - "O11"
                  - "O12"
                status: resolved
                children:
                  - id: N16
                    type: experiment
                    title: "Independently review the Task 004 implementation"
                    provenance: ai-executed
                    timestamp: "2026-07-29T09:11+02:00"
                    result: >
                      Round 1 independently passed all functional and
                      adversarial probes but reproduced one overbroad evidence
                      statement: Ruff format did not pass for the validator or
                      legacy workflow test. Both files failed identically at
                      setup and implementation commits, so the verdict was
                      Revision required for evidence correction only.
                    evidence:
                      - "ff939ab"
                      - ".agents/state/current-task.md"
                      - "docs/audits/distribution-installer.md"
                    status: resolved
                    children:
                      - id: N17
                        type: experiment
                        title: "Correct and reproduce the Ruff evidence"
                        provenance: ai-executed
                        timestamp: "2026-07-29T09:11+02:00"
                        result: >
                          Archived checkouts at 0a66c6f and 92148b4 produced
                          the same two-file Ruff format failure. The audit was
                          corrected without reformatting legacy files; six
                          focused and 36 full tests, live validation,
                          four-path Ruff lint, two-new-file Ruff format, and
                          whitespace checks passed before Round 2 handoff.
                        evidence:
                          - "0b1bd0ac1389db6b2790698996815aaafa7bf22b"
                          - "c0095c6"
                          - "docs/audits/distribution-installer.md"
                          - ".agents/state/current-task.md"
                          - "O13"
                        status: resolved
                        children:
                          - id: N18
                            type: experiment
                            title: "Accept the corrected Task 004 implementation"
                            provenance: ai-executed
                            timestamp: "2026-07-29T09:18+02:00"
                            result: >
                              Round 2 independently verified the bounded
                              evidence correction, confirmed the implementation
                              remained unchanged, reran six focused and 36 full
                              tests plus validation and static checks, and
                              returned Accepted with no required changes.
                            evidence:
                              - "ea69ea5"
                              - "docs/tasks/004-refactor-distribution-results-audit.md"
                              - "C11"
                              - "C12"
                            status: resolved
                            children:
                              - id: N19
                                type: decision
                                title: "Merge and archive accepted Task 004"
                                provenance: ai-executed
                                timestamp: "2026-07-29T09:18+02:00"
                                choice: >
                                  Merge the accepted branch into main, archive
                                  the complete Task 004 record, restore the
                                  exact current-task template, and update
                                  compact repository state.
                                alternatives:
                                  - "Require another revision without contrary evidence"
                                  - "Leave the independently accepted task unmerged"
                                evidence:
                                  - "N18"
                                  - "93324a7"
                                  - "6384e36"
                                  - "docs/tasks/004-refactor-distribution-results-audit.md"
                                status: resolved
                                children:
                                  - id: N20
                                    type: experiment
                                    title: "Verify Task 004 after main closeout"
                                    provenance: ai-executed
                                    timestamp: "2026-07-29T09:20+02:00"
                                    result: >
                                      A final independent check on clean main
                                      passed all six distribution tests, all
                                      36 repository tests, and live validation
                                      with 11 routed skills and four archives.
                                      The active task matched the exact blank
                                      template and Task 004 retained its
                                      Accepted verdict.
                                    evidence:
                                      - "d0e374f"
                                      - "docs/tasks/004-refactor-distribution-results-audit.md"
                                      - "tests/test_distribution.py"
                                      - "scripts/validate_agent_workflow.py"
                                    status: resolved
                                    children: []
  - id: N21
    type: question
    title: "Revalidate cross-repository workflow adoption"
    provenance: user
    timestamp: "2026-07-29T10:34+02:00"
    description: >
      Reassess whether Prospect, StructSplat, realtime-gs, or IntrinsicEngine
      should add or replace their workflows with agent-kit after Task 004, and
      whether any remaining target mechanism should move into agent-kit.
    also_depends_on: [N09, N13, N20]
    status: resolved
    children:
      - id: N22
        type: experiment
        title: "Probe the revised target snapshots"
        provenance: ai-executed
        timestamp: "2026-07-29T10:34+02:00"
        result: >
          At the timed Task 005 snapshot, Prospect was one commit beyond its
          Task 003 baseline, StructSplat and realtime-gs were unchanged, and
          IntrinsicEngine was three commits beyond its baseline. Changed-path
          classification found no new workflow policy, skill, validator, or CI
          change; fixed-commit target checks passed. The fixed payload
          preflight reported 0/1/1/1 collisions, with AGENTS.md as every
          nonzero collision.
        evidence:
          - "docs/research/cross-repository-agent-workflow-adoption.md"
          - "docs/tasks/005-revalidate-cross-repository-workflow-adoption.md"
          - "21b16952b4ebe930bde312c9f0bb0468ed46fc6e"
          - "cf4fe4196c4d7816ec38a519171ac5f0b2e108db"
        status: resolved
        children: []
      - id: N23
        type: experiment
        title: "Falsify the first Task 005 snapshot"
        provenance: ai-executed
        timestamp: "2026-07-29T10:34+02:00"
        result: >
          Independent Round 1 review showed that the first artifact's
          zero-drift premise missed one Prospect and two IntrinsicEngine
          commits that predated handoff. It also found that Task 004 had not
          implemented target-authority adaptation. The verdict was Revision
          required while the substantive target dispositions, P0/P1 closure,
          collision counts, and conditional installer-preview recommendation
          survived.
        evidence:
          - "d7c2950036ffe964910debf5a3d528174dbc2361"
          - "docs/tasks/005-revalidate-cross-repository-workflow-adoption.md"
        status: resolved
        children: []
      - id: N24
        type: experiment
        title: "Accept the corrected timed assessment"
        provenance: ai-executed
        timestamp: "2026-07-29T10:34+02:00"
        result: >
          The Driver replaced timeless HEAD claims with explicit fixed commits,
          included the third IntrinsicEngine commit, reran impacted disposable
          checks, and limited Task 004 completion to the clean payload and
          optional results audit. Round 2 reproduced distances 1/0/0/3, all
          changed-path classifications and checks, all 36 agent-kit tests, and
          live validation, then returned Accepted.
        evidence:
          - "c2222147ba5c46b7dc67ca81a97d183ee9884b63"
          - "3a27431e74d3d2443b7ee69ac1be6aaf28308cf6"
          - "docs/tasks/005-revalidate-cross-repository-workflow-adoption.md"
        status: resolved
        children: []
      - id: N25
        type: decision
        title: "Retain the bounded no-adoption disposition"
        provenance: ai-executed
        timestamp: "2026-07-29T10:34+02:00"
        choice: >
          Do not normally install agent-kit into or replace any target
          workflow. If explicitly prioritized, test the smallest coordination
          slice in realtime-gs first and Prospect separately later; use only
          failure-triggered in-place identity/verdict checks in StructSplat or
          IntrinsicEngine. Keep agent-kit's fixed payload and results audit,
          and add a read-only installer plan only before an authorized
          zero-collision pilot.
        alternatives:
          - "Treat safe packaging as evidence for immediate adoption"
          - "Install a parallel task authority in every target"
          - "Import IntrinsicEngine's general generator platform"
          - "Discard the target-specific evidence and task workflows"
        evidence:
          - "N22"
          - "N23"
          - "N24"
          - "docs/research/cross-repository-agent-workflow-adoption.md"
          - "docs/tasks/005-revalidate-cross-repository-workflow-adoption.md"
          - "9896501"
        status: resolved
        children: []
  - id: N26
    type: decision
    title: "Begin the maturity program with verification"
    provenance: user
    timestamp: "2026-07-29T11:31+02:00"
    choice: >
      Check, correct, and implement the maturity program in dependency order,
      beginning with the verification foundation as actual Task 006.
    alternatives:
      - "Leave the maturity program as proposed planning input"
      - "Implement a downstream profile before verification"
    evidence:
      - "docs/research/maturity-program-plan.md"
      - ".agents/state/current-task.md"
    status: resolved
    children:
      - id: N27
        type: experiment
        title: "Implement and falsify the verification foundation"
        provenance: ai-executed
        timestamp: "2026-07-29T11:31+02:00"
        result: >
          The branch added a pinned five-stage verify command, ARA checker,
          3.11-3.13 CI matrix, plan corrections, and 57 tests. Clean local and
          CI runs passed, but independent Round 1 review found four bypasses
          involving status normalization, proof containment, field parsing,
          and duplicate gate counting.
        evidence:
          - "a25c0f9"
          - "f2fc7e8"
          - "417cba5"
          - "docs/audits/verification-foundation.md"
        status: resolved
        children: []
      - id: N28
        type: experiment
        title: "Test the bounded verification revision"
        provenance: ai-executed
        timestamp: "2026-07-29T11:31+02:00"
        result: >
          Commit 04322dc closed all four Round 1 bypasses, passed 61 tests and
          the Python 3.11-3.13 matrix, and rejected traversal and external
          symlinks. Independent Round 2 review still reproduced two false
          negatives: empty or punctuation-only Status values and duplicate
          gate commands carrying trailing shell comments.
        evidence:
          - "04322dc"
          - "431e249"
          - "https://github.com/intrinsicD/agent-kit/actions/runs/30439177610"
          - ".agents/state/current-task.md"
        status: resolved
        children: []
      - id: N29
        type: question
        title: "Authorize a final bounded Task 006 revision"
        provenance: ai-suggested
        timestamp: "2026-07-29T11:31+02:00"
        description: >
          After two non-accepting independent review rounds, decide whether to
          authorize one final two-fix revision, accept the known false
          negatives, or close Task 006 as inconclusive.
        evidence:
          - "431e249"
          - "5e1153c"
          - ".agents/state/current-task.md"
        status: resolved
        children:
          - id: N30
            type: decision
            title: "Authorize the final bounded Task 006 revision"
            provenance: user
            timestamp: "2026-07-29T11:58+02:00"
            choice: >
              Apply the two bounded fixes for empty or punctuation-only claim
              statuses and gate duplicates hidden by trailing shell comments,
              then run one final independent review.
            alternatives:
              - "Accept the two known false negatives and weaken the claims"
              - "Close Task 006 as inconclusive without merging"
            evidence:
              - "N28"
              - "N29"
              - "docs/tasks/006-verification-foundation.md"
            status: resolved
            children:
              - id: N31
                type: experiment
                title: "Accept the final verification revision"
                provenance: ai-executed
                timestamp: "2026-07-29T11:58+02:00"
                result: >
                  Commit 2a77376 rejected the two remaining false negatives,
                  passed all 64 local tests, and passed CI on Python
                  3.11-3.13. Independent final review reproduced status and
                  commented-gate variants, confirmed the unchanged 22-file
                  distribution, and returned Accepted.
                evidence:
                  - "2a77376"
                  - "0cdc89c"
                  - "https://github.com/intrinsicD/agent-kit/actions/runs/30440422028"
                  - "docs/tasks/006-verification-foundation.md"
                  - "docs/audits/verification-foundation.md"
                status: resolved
                children:
                  - id: N32
                    type: decision
                    title: "Merge and archive accepted Task 006"
                    provenance: ai-executed
                    timestamp: "2026-07-29T11:58+02:00"
                    choice: >
                      Merge the independently accepted verification foundation,
                      archive its complete task record, restore the blank
                      active-task template, and make Installer v2 the next
                      validated maturity slice.
                    alternatives:
                      - "Leave the accepted branch unmerged"
                      - "Begin Installer v2 before completing Task 006 state"
                    evidence:
                      - "N31"
                      - "3239e99"
                      - "487b78f"
                      - "docs/tasks/006-verification-foundation.md"
                    status: resolved
                    children: []
      - id: N33
        type: question
        title: "Choose the Installer v2 prefix policy"
        provenance: ai-suggested
        timestamp: "2026-07-29T11:58+02:00"
        description: >
          Decide whether Task 007 requires --slug with an explicit
          --no-prefix escape hatch or keeps unprefixed installation as the
          default with optional --slug.
        evidence:
          - "docs/research/maturity-program-plan.md"
          - ".agents/state/current-task.md"
        status: open
        children: []
      - id: N34
        type: question
        title: "Choose the Installer v2 doctor receipt policy"
        provenance: ai-suggested
        timestamp: "2026-07-29T11:58+02:00"
        description: >
          Decide whether doctor uses a bounded installation receipt that
          hashes immutable payload and presence-checks user-owned templates,
          hashes every installed file, or operates without a receipt.
        evidence:
          - "docs/research/maturity-program-plan.md"
          - ".agents/state/current-task.md"
        status: open
        children: []
      - id: N35
        type: experiment
        title: "Falsify the first Task 008 validator pack"
        provenance: ai-executed
        timestamp: "2026-07-29T13:59+02:00"
        result: >
          Independent Round 1 review passed the seven-stage 105-test source
          gate, Python 3.11-3.13 CI inspection, and a fresh core-plus-verify
          target install, but reproduced five bounded gaps: comment-only Codex
          authority references, external empty Markdown scan roots, valid
          balanced or escaped link-label omissions, input-dependent malformed
          glob handling, and a workflow anti-drift mutation missed by its
          regression. The verdict was Revision required.
        evidence:
          - "0184f1f"
          - ".agents/state/current-task.md"
          - "docs/audits/validator-pack.md"
          - "tests/test_validator_pack.py"
          - "tests/test_distribution.py"
          - "tests/test_verification.py"
        also_depends_on: [N32]
        status: resolved
        children: []
