tree:
  - id: N01
    type: question
    title: "Audit the repository's agentic workflow"
    provenance: user
    timestamp: "2026-07-28T20:21+02:00"
    description: >
      Determine whether the repository contains problems in its two-agent
      operating workflow.
    status: resolved
    children:
      - id: N02
        type: experiment
        title: "Probe the documented installation command"
        provenance: ai-executed
        timestamp: "2026-07-28T20:21+02:00"
        result: >
          In a disposable target repository, the documented copy command
          changed origin from the target URL to the kit URL and changed the
          active branch and HEAD to the kit's values.
        evidence:
          - "docs/audits/agent-workflow-audit.md"
        status: resolved
        children: []
      - id: N03
        type: experiment
        title: "Exercise validator edge-state fixtures"
        provenance: ai-executed
        timestamp: "2026-07-28T20:21+02:00"
        result: >
          Eleven of eleven fixtures disagreed with protocol expectations: one
          documented valid review form was rejected and ten invalid states were
          accepted.
        evidence:
          - "docs/audits/agent-workflow-audit.md"
        status: resolved
        children: []
      - id: N04
        type: experiment
        title: "Independently falsify audit findings"
        provenance: ai-executed
        timestamp: "2026-07-28T20:21+02:00"
        result: >
          A second agent reproduced F1, F2, all eleven validator mismatches,
          and the rejected-branch closeout failure; it returned Accepted with
          follow-up.
        evidence:
          - "docs/tasks/001-agent-workflow-audit.md"
        status: resolved
        children: []
      - id: N05
        type: decision
        title: "Accept and archive the workflow audit"
        provenance: ai-executed
        timestamp: "2026-07-28T20:21+02:00"
        choice: >
          Merge and archive the reviewed audit while leaving workflow fixes for
          follow-up work.
        alternatives:
          - "Require revision of the audit"
          - "Reject the audit"
          - "Implement fixes in the review task"
        evidence:
          - "N02"
          - "N03"
          - "N04"
          - "docs/audits/agent-workflow-audit.md"
        status: resolved
        children:
          - id: N06
            type: decision
            title: "Remediate every accepted audit finding"
            provenance: user
            timestamp: "2026-07-29T00:07+02:00"
            choice: >
              Fix all six independently supported workflow findings rather
              than leave them as follow-up work.
            alternatives:
              - "Leave the accepted findings unresolved"
              - "Remediate only a subset"
            evidence:
              - "docs/audits/agent-workflow-audit.md"
              - "docs/tasks/001-agent-workflow-audit.md"
            status: resolved
            children:
              - id: N07
                type: experiment
                title: "Adversarially validate the workflow remediation"
                provenance: ai-executed
                timestamp: "2026-07-29T00:07+02:00"
                result: >
                  Two independent review revision rounds added ten regression
                  cases beyond the initial suite. The final 31 tests passed,
                  the repository validator accepted both archives, and the
                  reviewer returned Accepted.
                evidence:
                  - "docs/tasks/002-fix-workflow-audit-findings.md"
                  - "tests/test_agent_workflow.py"
                  - "scripts/validate_agent_workflow.py"
                  - "c879ad7"
                status: resolved
                children:
                  - id: N08
                    type: decision
                    title: "Merge and archive the accepted remediation"
                    provenance: ai-executed
                    timestamp: "2026-07-29T00:07+02:00"
                    choice: >
                      Merge task 002 into main, archive its complete handoff
                      history, and reset current-task.md to the exact template.
                    alternatives:
                      - "Require another revision without new contrary evidence"
                      - "Leave the accepted task unmerged"
                evidence:
                  - "N07"
                  - "docs/tasks/002-fix-workflow-audit-findings.md"
                  - "b444f6c"
                  - "f198163"
                status: resolved
                children: []
  - id: N09
    type: question
    title: "Assess cross-repository workflow adoption"
    provenance: user
    timestamp: "2026-07-29T00:55+02:00"
    description: >
      Determine whether Prospect, StructSplat, realtime-gs, and
      IntrinsicEngine should add or replace their workflows with agent-kit,
      and identify workflow mechanisms worth bringing back into agent-kit.
    status: resolved
    children:
      - id: N10
        type: experiment
        title: "Probe target compatibility and workflow evidence"
        provenance: ai-executed
        timestamp: "2026-07-29T00:55+02:00"
        result: >
          Read-only inventory and executable checks found 11, 12, 11, and 12
          tracked-path collisions respectively; the payload also contains
          non-colliding agent-kit state and research history. Target structural
          checks passed and each target recorded real review practice without
          general identity/verdict enforcement.
        evidence:
          - "docs/research/cross-repository-agent-workflow-adoption.md"
          - "docs/tasks/003-cross-repository-agent-workflow-adoption.md"
          - "d8d649512f454c219dba55dd12f4d0398cb742e9"
        status: resolved
        children: []
      - id: N11
        type: experiment
        title: "Falsify the first adoption assessment"
        provenance: ai-executed
        timestamp: "2026-07-29T00:55+02:00"
        result: >
          Independent review reproduced the collision and history findings but
          rejected unsupported adoption rankings, an overbroad P0, and
          conflation of review norms, recorded practice, and enforcement.
        evidence:
          - "docs/tasks/003-cross-repository-agent-workflow-adoption.md"
          - "37c3a1f"
        status: resolved
        children: []
      - id: N12
        type: experiment
        title: "Validate the calibrated assessment"
        provenance: ai-executed
        timestamp: "2026-07-29T00:55+02:00"
        result: >
          After six bounded revisions, independent review reproduced the exact
          collision counts and history payload, accepted the review taxonomy
          and P0/P1/P2 split, and returned Accepted. All 31 workflow tests and
          live validation passed.
        evidence:
          - "docs/research/cross-repository-agent-workflow-adoption.md"
          - "docs/tasks/003-cross-repository-agent-workflow-adoption.md"
          - "849b02e"
        status: resolved
        children: []
      - id: N13
        type: decision
        title: "Leave target workflows unchanged pending bounded pilots"
        provenance: ai-executed
        timestamp: "2026-07-29T00:55+02:00"
        choice: >
          Do not install agent-kit into or replace any assessed target
          workflow. First create a clean distribution boundary in agent-kit;
          then measure minimal coordination pilots in realtime-gs and
          Prospect, with only failure-triggered in-place experiments for
          StructSplat and IntrinsicEngine.
        alternatives:
          - "Install the full workflow in one or more targets now"
          - "Replace the targets' existing workflows"
          - "Add a parallel agent-kit task authority"
          - "Make no reciprocal improvements to agent-kit"
        evidence:
          - "N10"
          - "N11"
          - "N12"
          - "docs/research/cross-repository-agent-workflow-adoption.md"
        status: resolved
        children:
          - id: N14
            type: decision
            title: "Implement the clean distribution boundary and results audit"
            provenance: user
            timestamp: "2026-07-29T08:59+02:00"
            choice: >
              Fix the accepted clean-distribution blocker and add the bounded
              generic results-audit procedure in Task 004, without installing
              into targets or adding P2 or configurable-platform scope.
            alternatives:
              - "Leave the accepted P0 and P1 findings unresolved"
              - "Expand Task 004 into target integration or distribution infrastructure"
            evidence:
              - "N10"
              - "N12"
              - "N13"
              - "docs/research/cross-repository-agent-workflow-adoption.md"
            status: resolved
            children:
              - id: N15
                type: experiment
                title: "Exercise the fixed distribution implementation"
                provenance: ai-executed
                timestamp: "2026-07-29T08:59+02:00"
                result: >
                  Commit 92148b4 introduced the fixed 22-file payload and
                  results-audit skill. Six disposable distribution tests and
                  all 36 repository tests passed; the installed blank target
                  validated with 11 skills and zero archives, collision
                  targets remained unchanged, and Driver code audit found no
                  required fix before independent review.
                evidence:
                  - "92148b4c19b84614301c03ff77b736de54cb65d7"
                  - "tests/test_distribution.py"
                  - "docs/audits/distribution-installer.md"
                  - ".agents/state/current-task.md"
                  - "O11"
                  - "O12"
                status: resolved
                children: []
